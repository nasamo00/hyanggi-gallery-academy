<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="1분 만에 내 타고난 성향과 몸과 마음의 컨디션, 끌리는 향의 힌트를 확인해 보세요.">
  <meta name="theme-color" content="#f8f7f1">
  <title>1분 만에 끝내는 내 타고난 향기 테스트 | 향기의갤러리</title>
  <style>
    :root { --ink:#183d36; --forest:#0b5e53; --leaf:#39906e; --paper:#f8f7f1; --sand:#eee7d7; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 20px; background:radial-gradient(ellipse at 88% 10%, #e5efe6 0, transparent 35%), var(--paper); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif; line-height:1.75; }
    .card { width:min(100%, 720px); position:relative; overflow:hidden; padding:clamp(32px, 8vw, 72px); border:1px solid rgba(24,61,54,.12); border-radius:28px; background:rgba(255,255,255,.88); box-shadow:0 24px 70px rgba(24,61,54,.1); }
    .card::after { content:""; position:absolute; width:190px; height:190px; right:-94px; top:-95px; border:30px solid rgba(57,144,110,.12); border-radius:52% 48% 64% 36%; transform:rotate(-24deg); pointer-events:none; }
    .brand { margin:0 0 44px; color:var(--forest); font-size:.88rem; font-weight:700; letter-spacing:.08em; }
    .eyebrow { margin:0 0 12px; color:var(--leaf); font-size:.9rem; font-weight:700; }
    h1 { max-width:12em; margin:0 0 24px; font-family:Georgia,"Nanum Myeongjo",serif; font-size:clamp(2.25rem, 8vw, 4.25rem); line-height:1.2; letter-spacing:-.055em; word-break:keep-all; }
    .intro { max-width:34rem; margin:0 0 12px; font-size:clamp(1.05rem, 3vw, 1.2rem); word-break:keep-all; }
    .invite { margin:0 0 32px; color:#46625b; word-break:keep-all; }
    .cta { display:inline-flex; min-height:58px; align-items:center; justify-content:center; gap:8px; padding:0 26px; border-radius:999px; background:var(--forest); color:var(--white); font-weight:700; text-decoration:none; box-shadow:0 12px 24px rgba(11,94,83,.2); transition:transform .18s ease, background .18s ease; }
    .cta:hover { transform:translateY(-2px); background:#07483f; }
    .cta:focus-visible, .back:focus-visible { outline:3px solid var(--leaf); outline-offset:4px; }
    .note { margin:20px 0 0; color:#65756f; font-size:.88rem; }
    .back { display:inline-block; margin-top:42px; color:var(--forest); font-weight:700; text-decoration-thickness:1px; text-underline-offset:4px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">향기의갤러리 · 향기로 나를 이해하다</p>
    <p class="eyebrow">나를 알아가는 작은 시작</p>
    <h1>1분 만에 끝내는 내 타고난 향기 테스트</h1>
    <p class="intro">내 타고난 성향, 지금 몸과 마음의 컨디션, 그리고 끌리는 향의 힌트까지.</p>
    <p class="invite">내가 어떤 향으로 태어났는지 지금 바로 확인해 보세요!</p>
    <a class="cta" href="https://hyangigall-9mehn5eu.manus.space" target="_blank" rel="noopener noreferrer">👇 나만의 타고난 향 진단하기</a>
    <p class="note">진단 페이지가 새 창에서 열립니다.</p>
    <a class="back" href="index.html">← 향기의갤러리 페이지로 돌아가기</a>
  </main>
</body>
</html>
